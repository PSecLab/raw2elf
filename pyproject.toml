[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "raw2elf"
description = "Reconstruct an analysis-ready ELF from a raw firmware dump"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["capstone>=5.0"]
keywords = [
    "firmware",
    "reverse-engineering",
    "elf",
    "cortex-m",
    "embedded",
    "binary-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Embedded Systems",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
raw2elf = "raw2elf.cli:main"

[project.urls]
Homepage = "https://github.com/PSecLab/raw2elf"
Documentation = "https://github.com/PSecLab/raw2elf/tree/main/docs"

[tool.setuptools.dynamic]
version = { attr = "raw2elf.__version__" }

[tool.setuptools.packages.find]
include = ["raw2elf*"]

[tool.setuptools.package-data]
# The reference firmwares travel with the package so that the evaluation
# harness has its corpus after an install, without needing a cross toolchain.
raw2elf = ["tests/fixtures/*.elf"]
